name: One-time lockfile repair
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/repair-lockfile-once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Regenerate and verify lockfile
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile --dry-run
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/repair-lockfile-once.yml
          git commit -m "fix: sync Bun lockfile with Capacitor dependencies"
          git push
