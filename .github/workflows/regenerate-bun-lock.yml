name: Regenerate Bun lockfile

on:
  push:
    branches:
      - fix/regenerate-bun-lockfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/regenerate-bun-lockfile
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Regenerate lockfile from package manifest
        run: bun install --lockfile-only
      - name: Validate frozen install metadata
        run: bun install --frozen-lockfile --dry-run
      - name: Commit updated lockfile if needed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate Bun lockfile"
          git push origin HEAD:fix/regenerate-bun-lockfile
