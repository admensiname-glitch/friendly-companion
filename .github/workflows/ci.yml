name: Ensina-me CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Sync generated route tree"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ensina-me-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout default branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify migration version uniqueness
        run: bun run verify:migrations

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Verify generated route tree is synchronized
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- src/routeTree.gen.ts
