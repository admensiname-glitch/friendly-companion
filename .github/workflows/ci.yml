name: Ensina-me CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ensina-me-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Verify generated route tree is synchronized
        run: git diff --exit-code -- src/routeTree.gen.ts
