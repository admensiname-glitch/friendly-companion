name: Ensina-me Student Flow E2E

on:
  workflow_dispatch:

jobs:
  student-flow:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Start production preview
        run: |
          bun run preview -- --host 0.0.0.0 --port 4173 > /tmp/ensina-me-vite.log 2>&1 &
          echo $! > /tmp/ensina-me-vite.pid
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl --silent --show-error --max-time 2 http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ensina-me-vite.log
          exit 1
      - name: Run complete student journey
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: node e2e/student-flow.mjs
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/ensina-me-vite.pid ]; then kill "$(cat /tmp/ensina-me-vite.pid)" || true; fi
