name: Ensina-me Student Flow E2E

on:
  workflow_dispatch:

jobs:
  student-flow:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Start app server
        run: |
          bun run dev -- --host 0.0.0.0 --port 4173 > /tmp/ensina-me-vite.log 2>&1 &
          echo $! > /tmp/ensina-me-vite.pid
      - name: Wait for app HTTP 200
        run: |
          status=000
          for i in {1..30}; do
            status=$(curl --silent --output /dev/null --max-time 2 --write-out '%{http_code}' http://127.0.0.1:4173/ || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "App server did not return HTTP 200 (last status: $status)"
          cat /tmp/ensina-me-vite.log
          exit 1
      - name: Run complete student journey
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: node e2e/student-flow.mjs
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/ensina-me-vite.pid ]; then kill "$(cat /tmp/ensina-me-vite.pid)" || true; fi
