name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "www/**"
      - "assets/**"
      - ".github/workflows/android.yml"
      - "public/icon-512.jpg"
      - "public/icon-192.png"
      - "public/ensina-me-icon.svg"
      - "public/manifest.webmanifest"
      - "src/router.tsx"
      - "src/styles.css"
      - "src/routes/__root.tsx"
      - "package.json"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - name: Install Capacitor toolchain
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/assets@3.0.5
      - name: Prepare app assets
        run: |
          mkdir -p assets www
          cp public/ensina-me-icon.svg assets/icon.svg
          convert assets/icon.svg -resize 1024x1024! assets/icon.png
          # Capacitor requires a webDir even though the native app opens the production
          # Ensina-me URL in its Android WebView.
          if [ ! -f www/index.html ]; then
            printf '%s\n' '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > www/index.html
          fi
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Android immersive fullscreen
        run: |
          mkdir -p android/app/src/main/java/com/ensiname/app
          cat > android/app/src/main/java/com/ensiname/app/MainActivity.java <<'EOF'
          package com.ensiname.app;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private void hideSystemBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat controller =
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              if (controller != null) {
                controller.hide(WindowInsetsCompat.Type.systemBars());
                controller.setSystemBarsBehavior(
                    WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                );
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideSystemBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                hideSystemBars();
              }
            }
          }
          EOF
      - name: Generate Android icon and splash assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#0242D7" --iconBackgroundColorDark "#0242D7" --splashBackgroundColor "#F8FAFC" --splashBackgroundColorDark "#0B1220"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build debug AAB
        working-directory: android
        run: ./gradlew bundleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ensina-me-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ensina-me-android-aab-debug
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error