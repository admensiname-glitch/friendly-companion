name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "www/**"
      - "assets/**"
      - ".github/workflows/android.yml"
      - "public/icon-512.jpg"
      - "public/icon-192.png"
      - "package.json"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - name: Install Capacitor toolchain
        run: npm install --no-save @capacitor/cli@8.5.2 @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/assets@3.0.5
      - name: Prepare app assets
        run: |
          mkdir -p assets
          cp public/icon-192.png assets/icon.png
          test -f www/index.html
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Android icon and splash assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#0242D7" --iconBackgroundColorDark "#0242D7" --splashBackgroundColor "#F8FAFC" --splashBackgroundColorDark "#0B1220"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build debug AAB
        working-directory: android
        run: ./gradlew bundleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ensina-me-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ensina-me-android-aab-debug
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error