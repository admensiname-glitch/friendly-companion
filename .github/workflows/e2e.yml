name: Ensina-me E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ensina-me-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start app
        run: |
          bun run dev --host 127.0.0.1 > /tmp/ensina-me-vite.log 2>&1 &
          echo $! > /tmp/ensina-me-vite.pid
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ensina-me-vite.log
          exit 1
      - name: Run browser smoke tests
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx --yes -p playwright@1.55.0 node e2e/smoke.mjs
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/ensina-me-vite.pid ]; then kill "$(cat /tmp/ensina-me-vite.pid)" || true; fi
