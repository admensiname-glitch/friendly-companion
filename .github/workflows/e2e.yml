name: Ensina-me E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ensina-me-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Start production preview
        run: |
          bun run preview -- --host 0.0.0.0 --port 4173 > /tmp/ensina-me-vite.log 2>&1 &
          echo $! > /tmp/ensina-me-vite.pid
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ensina-me-vite.log
          exit 1
      - name: Verify preview server
        run: curl --silent --show-error --max-time 5 http://127.0.0.1:4173/ -o /dev/null -w '%{http_code}\n'
      - name: Browser smoke tests
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const failures = [];
          page.on('pageerror', error => failures.push(error.message));
          for (const path of ['/', '/login', '/cadastro']) {
            const response = await page.goto('http://127.0.0.1:4173' + path, { waitUntil: 'domcontentloaded' });
            if (!response || response.status() >= 500) throw new Error(path + ' returned HTTP ' + (response?.status() ?? 'no response'));
            await page.locator('body').waitFor();
            const bodyText = (await page.locator('body').innerText()).trim();
            if (!bodyText) throw new Error(path + ' rendered an empty page');
          }
          await browser.close();
          if (failures.length) throw new Error('Browser JavaScript errors: ' + failures.join(' | '));
          NODE
      - name: Print preview logs on failure
        if: failure()
        run: cat /tmp/ensina-me-vite.log || true
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/ensina-me-vite.pid ]; then kill "$(cat /tmp/ensina-me-vite.pid)" || true; fi
