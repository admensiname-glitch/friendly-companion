name: Ensina-me E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ensina-me-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Start app server for browser smoke tests
        run: |
          bun run dev -- --host 0.0.0.0 --port 4173 > /tmp/ensina-me-vite.log 2>&1 &
          echo $! > /tmp/ensina-me-vite.pid
      - name: Wait for app HTTP 200
        run: |
          for i in {1..30}; do
            status=$(curl --silent --output /dev/null --max-time 2 --write-out '%{http_code}' http://127.0.0.1:4173/ || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "Preview did not return HTTP 200 (last status: $status)"
          cat /tmp/ensina-me-vite.log
          curl --silent --show-error --max-time 5 http://127.0.0.1:4173/ | head -c 4000 || true
          exit 1
      - name: Verify preview server
        run: curl --silent --show-error --max-time 5 http://127.0.0.1:4173/ -o /dev/null -w '%{http_code}\n'
      - name: Verify SEO and mobile smoke tests
        run: node e2e/ci-smoke.mjs
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/ensina-me-vite.pid ]; then kill "$(cat /tmp/ensina-me-vite.pid)" || true; fi
